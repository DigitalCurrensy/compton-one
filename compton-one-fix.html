<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPTON ONE: FIX — One problem. One path forward.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#101210; --paper:#F2EFE5; --signal:#D7FF45; --blue:#315CFF;
  --orange:#FF6B35; --green:#2FCB75; --concrete:#A8AAA3;
  --ink:#101210; --ink-60:#10121099; --line:#10121022;
  --display:'Barlow Condensed',Arial Narrow,Haettenschweiler,sans-serif;
  --ui:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(16px,4vw,32px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.02;margin:0}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--blue);color:#fff;padding:12px 18px;z-index:99;font-weight:600}
.skip:focus{left:8px;top:8px}
.wrap{max-width:940px;margin:0 auto;padding:0 var(--pad)}

/* header */
header{background:var(--night);color:var(--paper);position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff14}
.hbar{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:21px;letter-spacing:.06em;text-transform:uppercase;margin-right:auto}
.brand b{color:var(--paper)} .brand span{color:var(--signal)}
.lang{display:flex;border:1px solid #ffffff33;border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:var(--paper);border:0;padding:9px 15px;min-height:44px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--night)}

/* steps */
.steps{display:flex;gap:6px;padding:12px 0;flex-wrap:wrap}
.step{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--concrete);display:flex;align-items:center;gap:6px}
.step::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.step.on{color:var(--ink)} .step.on::before{background:var(--signal);box-shadow:0 0 0 3px #d7ff4540}
.step.done::before{background:var(--green)}

/* hero */
.hero{background:var(--night);color:var(--paper);padding:clamp(40px,8vw,84px) 0 clamp(48px,9vw,96px)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal)}
.hero h1{font-size:clamp(46px,10.5vw,104px);text-transform:uppercase;margin:14px 0 0}
.hero h1 em{font-style:normal;color:var(--concrete)}
.lede{font-size:clamp(17px,2.4vw,21px);color:#F2EFE5CC;max-width:56ch;margin-top:20px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{border:0;border-radius:999px;padding:15px 26px;min-height:48px;font-weight:600;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2449d6}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid #ffffff44}
.btn-ghost:hover{border-color:var(--paper)}
.btn-dark{background:var(--night);color:var(--paper)}
.btn-quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.trust{margin-top:22px;font-size:13.5px;color:var(--concrete);display:flex;align-items:center;gap:8px}

/* sections */
main{padding:clamp(32px,6vw,64px) 0 96px}
.tile-group{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:26px 0 12px}
.tile-group:first-child{margin-top:0}
.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-60);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;min-height:88px;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--blue)}
.tile .t{font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.05}
.tile .s{font-size:12.5px;color:var(--ink-60)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.how div{border-top:2px solid var(--night);padding-top:12px}
.how .n{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-60)}
.how h3{font-size:22px;text-transform:uppercase;margin:6px 0 4px}
.how p{font-size:14px;color:var(--ink-60)}

/* card / forms */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3.4vw,28px)}
label.fld{display:block;font-weight:600;margin-bottom:8px}
.hint{font-size:14px;color:var(--ink-60);margin-bottom:12px}
textarea{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:var(--paper);color:var(--ink);resize:vertical;min-height:132px}
textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #315cff30}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{background:transparent;border:1px dashed var(--concrete);color:var(--ink-60);border-radius:999px;padding:9px 14px;min-height:40px;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--blue);color:var(--blue);border-style:solid}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* notices */
.notice{border-radius:14px;padding:15px 17px;font-size:14.5px;display:flex;gap:12px;align-items:flex-start;margin-top:16px}
.notice .ic{font-family:var(--mono);font-weight:600;flex-shrink:0}
.n-privacy{background:#31 5cff0d;background:#315cff0d;border:1px solid #315cff33}
.n-warn{background:#ff6b350f;border:1px solid #ff6b3540}
.n-demo{background:#10121008;border:1px dashed var(--concrete);color:var(--ink-60);font-size:13px}
.n-emerg{background:var(--orange);color:#fff;border:0}
.n-emerg a{color:#fff}

/* receipt — signature element */
.receipt{background:#fff;border:1px solid var(--line);border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 1px 0 #10121010,0 18px 40px -28px #10121055}
.r-head{background:var(--night);color:var(--paper);padding:20px clamp(18px,3.4vw,28px)}
.r-meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--concrete)}
.r-meta b{color:var(--signal);font-weight:500}
.r-head h2{font-size:clamp(30px,5.6vw,44px);text-transform:uppercase;margin-top:10px}
.r-body{padding:clamp(18px,3.4vw,28px);display:grid;gap:22px}
.blk{display:grid;gap:9px}
.blk>h3{font-size:19px;text-transform:uppercase;letter-spacing:.01em}
.kv{font-size:15px}
.kv b{font-weight:600}
.tear{height:22px;background:
  radial-gradient(circle at 11px -4px, transparent 11px, #fff 12px) repeat-x;
  background-size:22px 22px;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;
  -webkit-mask-image:linear-gradient(#000,#000);}
.tearwrap{filter:drop-shadow(0 10px 20px #10121012)}

.method{border:1px solid var(--line);border-radius:13px;padding:14px;display:grid;gap:5px;background:var(--paper)}
.method .big{font-family:var(--mono);font-size:19px;font-weight:500;word-break:break-all}
.method a{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:999px;font-weight:500}
.p-ver{background:#2fcb7522;color:#1a7c46}
.p-need{background:#ff6b3522;color:#9c3c14}
.p-hist{background:#a8aaa333;color:#5c5e58}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.check li{display:flex;gap:11px;align-items:flex-start;font-size:15px}
ul.check li::before{content:"";width:17px;height:17px;border:1.5px solid var(--concrete);border-radius:5px;flex-shrink:0;margin-top:3px}
ul.no li::before{content:"×";border:0;color:var(--orange);font-weight:700;font-size:19px;line-height:1;width:auto;margin-top:0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer}
body.print-only header,body.print-only footer,body.print-only .row,body.print-only #keepbar,body.print-only .step,body.print-only .chips{display:none}
ul.check.live li::before{display:none}
ul.check.live label{display:flex;gap:11px;align-items:flex-start;cursor:pointer;padding:9px 0;min-height:44px;box-sizing:border-box}
ul.check.live input{width:21px;height:21px;flex:none;margin:1px 0 0;accent-color:var(--blue)}
.ev-prog{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);margin-top:8px}
.fnl{display:grid;gap:7px;margin:14px 0 18px}
.fnl .r{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.fnl .lab{flex:none;width:min(196px,44vw);color:var(--ink-60)}
.fnl .bar{height:9px;background:var(--blue);border-radius:5px;min-width:3px}
.fnl .n{color:var(--ink-60)}
.evlog{font-family:var(--mono);font-size:11.5px;display:grid;gap:5px;max-height:240px;overflow:auto}
.evlog .row2{display:flex;gap:10px;padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:9px;flex-wrap:wrap}
.evlog .e{font-weight:700}
.evlog .p{color:var(--ink-60)}
.script{background:var(--paper);border-left:3px solid var(--blue);padding:15px;border-radius:0 12px 12px 0;font-size:15px}
.srcs{font-size:13px;color:var(--ink-60);display:grid;gap:6px}
.srcs a{color:var(--ink-60)}

/* timeline */
.tl{list-style:none;padding:0;margin:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:104px 24px 1fr;gap:12px;align-items:start;padding:11px 0}
.tl .d{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-60);padding-top:3px}
.tl .dot{position:relative;display:flex;justify-content:center}
.tl .dot i{width:11px;height:11px;border-radius:50%;background:var(--concrete);margin-top:5px;display:block}
.tl li.done .dot i{background:var(--green)}
.tl li.now .dot i{background:var(--signal);box-shadow:0 0 0 4px #d7ff4540}
.tl .dot::after{content:"";position:absolute;top:18px;bottom:-14px;width:1.5px;background:var(--line)}
.tl li:last-child .dot::after{display:none}
.tl .st{font-family:var(--display);font-size:19px;text-transform:uppercase}
.tl .nt{font-size:13.5px;color:var(--ink-60)}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}
.stat .v{font-family:var(--display);font-size:38px;line-height:1}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);margin-top:4px}
.caselist{display:grid;gap:9px}
.caseitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.caseitem .id{font-family:var(--mono);font-size:12.5px;color:var(--ink-60)}
.caseitem .ti{font-weight:600;margin-right:auto}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--line)}
.b-res{background:#2fcb7526;color:#1a7c46} .b-due{background:#ff6b3526;color:#9c3c14}
.b-sub{background:#315cff1f;color:#2449d6} .b-ready{background:#d7ff4547;color:#5a6b12}

footer{background:var(--night);color:var(--concrete);padding:32px 0;font-size:13px}
footer a{color:var(--concrete)}
.hidden{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){ .tl li{grid-template-columns:78px 20px 1fr} .r-meta{gap:12px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}.receipt{box-shadow:none;border:1px solid #999}}
@media print{
  header,footer,.row,.chips,#keepbar,#funnel,#evlog,.step,.skip,#v-landing,#v-dashboard{display:none !important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .card,.receipt,.method{border-color:#999;box-shadow:none;break-inside:avoid}
  .r-head{background:#fff !important;color:#000 !important}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:10px;word-break:break-all}
  .notice{border:1px solid #999}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header>
  <div class="wrap hbar">
    <div class="brand"><b>Compton One</b> <span>: Fix</span></div>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button id="lang-en" aria-pressed="true" onclick="setLang('en')">English</button>
      <button id="lang-es" aria-pressed="false" onclick="setLang('es')">Español</button>
    </div>
  </div>
  <div class="wrap steps" id="steps" aria-hidden="true"></div>
</header>

<main id="main">

<!-- LANDING -->
<section id="v-landing">
  <div class="hero">
    <div class="wrap">
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1><span data-t="h1a"></span><br><em data-t="h1b"></em></h1>
      <p class="lede" data-t="lede"></p>
      <div class="cta-row">
        <button class="btn btn-primary" onclick="startReport('cta')"><span data-t="cta"></span> →</button>
        <button class="btn btn-ghost" onclick="runDemo()" data-t="ctademo"></button>
      </div>
      <p class="trust"><span aria-hidden="true">🔒</span> <span data-t="trust"></span></p>
    </div>
  </div>
  <div class="wrap" style="padding-top:44px">
    <p class="sec-label" data-t="supported"></p>
    <div id="tiles"></div>

    <p class="sec-label" style="margin-top:44px" data-t="howlabel"></p>
    <div class="how" id="how"></div>

    <div class="notice n-privacy" style="margin-top:34px">
      <span class="ic" aria-hidden="true">i</span><span data-t="privacy"></span>
    </div>
    <div class="notice n-demo"><span class="ic" aria-hidden="true">▲</span><span data-t="disclosure"></span></div>
  </div>
</section>

<!-- INTAKE -->
<section id="v-intake" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step1"></p>
  <h1 style="font-size:clamp(34px,6.5vw,58px);text-transform:uppercase;margin:10px 0 20px" data-t="intakeH"></h1>
  <div class="card">
    <label class="fld" for="issue" data-t="what"></label>
    <p class="hint" data-t="whatHint"></p>
    <textarea id="issue" aria-describedby="issue-hint"></textarea>
    <p id="issue-hint" class="vh" data-t="whatHint"></p>
    <p class="hint" style="margin:14px 0 0" data-t="examples"></p>
    <div class="chips" id="chips"></div>
    <div class="notice n-privacy"><span class="ic" aria-hidden="true">🔒</span><span data-t="intakePriv"></span></div>
    <div class="row">
      <button class="btn btn-primary" onclick="analyze()"><span data-t="analyze"></span> →</button>
      <button class="btn btn-quiet" id="btn-voice" aria-pressed="false" onclick="voiceInput()" data-t="voice"></button>
      <button class="btn btn-quiet" onclick="go('landing')" data-t="back"></button>
    </div>
    <p class="hint" id="voice-status" aria-live="polite" style="margin-top:10px;font-weight:600;color:var(--blue)"></p>
    <p class="hint" style="margin-top:6px" data-t="voiceNote"></p>
    <p id="err" role="alert" style="color:var(--orange);font-weight:600;margin-top:12px"></p>
  </div>
</section>

<!-- CLARIFY -->
<section id="v-clarify" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step2"></p>
  <h1 style="font-size:clamp(30px,5.5vw,48px);text-transform:uppercase;margin:10px 0 8px" data-t="clarifyH"></h1>
  <p class="hint" id="clarify-conf"></p>
  <div class="card">
    <h2 style="font-size:23px" id="clarify-q"></h2>
    <div class="row">
      <button class="btn btn-primary" onclick="clarifyAnswer(true)" data-t="yes"></button>
      <button class="btn btn-quiet" onclick="clarifyAnswer(false)" data-t="notsure"></button>
    </div>
  </div>
</section>

<!-- AMBIGUOUS -->
<section id="v-choose" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step2"></p>
  <h1 style="font-size:clamp(30px,5.5vw,48px);text-transform:uppercase;margin:10px 0 8px" data-t="chooseH"></h1>
  <p class="hint" data-t="chooseHint"></p>
  <div class="grid5" id="choose-opts" style="margin-top:16px"></div>
</section>

<!-- UNSUPPORTED -->
<section id="v-unsupported" class="wrap hidden">
  <div class="card">
    <h1 style="font-size:32px;text-transform:uppercase" data-t="unsupH"></h1>
    <p class="hint" style="margin-top:10px" data-t="unsupBody"></p>
    <div id="unsup-tiles" style="margin-top:18px"></div>
    <div class="row"><button class="btn btn-quiet" onclick="go('intake')" data-t="back"></button></div>
  </div>
</section>

<!-- EMERGENCY -->
<section id="v-emergency" class="wrap hidden">
  <div class="notice n-emerg" style="display:block;padding:26px" role="alert">
    <h1 style="font-size:clamp(28px,5vw,42px);text-transform:uppercase" id="em-h"></h1>
    <p style="margin-top:12px;font-size:17px" id="em-b"></p>
    <p style="margin-top:16px;font-family:var(--mono);font-size:19px;font-weight:600" id="em-911"></p>
    <p style="margin-top:6px;font-family:var(--mono);font-size:15px" id="em-sh"></p>
  </div>
  <div class="row"><button class="btn btn-quiet" onclick="go('intake')" data-t="back"></button></div>
</section>

<!-- RECEIPT -->
<section id="v-receipt" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step3"></p>
  <div class="tearwrap">
    <div class="receipt" id="receipt"></div>
    <div id="keepbar" style="margin-top:20px"></div>
    <p class="hint" id="print-note" aria-live="polite" style="margin-top:10px"></p>
    <div class="tear"></div>
  </div>
  <div class="row noprint">
    <button class="btn btn-primary" onclick="go('timeline')"><span data-t="saved"></span> →</button>
    <button class="btn btn-quiet" onclick="downloadIcs()" data-t="cal"></button>
    <button class="btn btn-quiet" onclick="printReceipt()" data-t="print"></button>
    <button class="btn btn-quiet" onclick="go('intake')" data-t="edit"></button>
  </div>
</section>

<!-- TIMELINE -->
<section id="v-timeline" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step4"></p>
  <h1 style="font-size:clamp(30px,5.5vw,48px);text-transform:uppercase;margin:10px 0 20px" data-t="tlH"></h1>
  <div class="card">
    <ul class="tl" id="tl"></ul>
    <div class="card" style="margin-top:18px;background:var(--paper);border-style:dashed">
      <label class="fld" for="conf" data-t="confLabel"></label>
      <p class="hint" id="conf-hint"></p>
      <input id="conf" style="width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-family:var(--mono);background:#fff" placeholder="e.g. SR-2026-04182">
      <div class="row">
        <button class="btn btn-dark" onclick="saveConf()" data-t="saveConf"></button>
        <button class="btn btn-quiet" onclick="markResolved()" data-t="resolve"></button>
        <button class="btn btn-quiet hidden" id="btn-reopen" onclick="reopenCase()" data-t="reopen"></button>
        <button class="btn btn-quiet" onclick="deleteCase()" data-t="del"></button>
      </div>
    </div>
    <div class="notice n-demo"><span class="ic" aria-hidden="true">▲</span><span data-t="simNote"></span></div>
  </div>
  <div class="row"><button class="btn btn-primary" onclick="go('dashboard')" data-t="toDash"></button></div>
</section>

<!-- DASHBOARD -->
<section id="v-dashboard" class="wrap hidden">
  <p class="eyebrow" style="color:var(--ink-60)" data-t="step5"></p>

    if (k === 'emergency') { track('emergency_gate_shown', { trigger_class: 'keyword_gate' }); renderEmergency(); return go('emergency'); }
    if (k === 'unsupported') { track('error_shown', { error_code: 'out_of_scope', view: 'intake' }); return go('unsupported'); }
    if (k === 'ambiguous') { track('clarification_shown', { confidence_band: 'low' }); renderChoose(); return go('choose'); }
    if (k === 'clarify') { track('clarification_shown', { service_id: state.cls.serviceId, confidence_band: C1.confidenceBand(state.cls.confidence) }); renderClarify(); return go('clarify'); }
    buildAndShow();
  };

  function renderClarify() {
    document.getElementById('clarify-q').textContent = state.cls.question[lang];
    document.getElementById('clarify-conf').textContent =
      t('conf') + ': ' + Math.round(state.cls.confidence * 100) + '% — ' +
      (lang === 'en' ? 'we want to be sure before we send you anywhere.' : 'queremos estar seguros antes de enviarle a algún lado.');
  }
  window.clarifyAnswer = function (yes) {
    if (yes) { state.cls = { kind: 'routed', serviceId: state.cls.serviceId, confidence: 0.95, alternates: [] }; return buildAndShow(); }
    var alts = state.cls.alternates && state.cls.alternates.length ? state.cls.alternates : C1.SERVICE_IDS.filter(function (i) { return i !== state.cls.serviceId; });
    state.cls = { kind: 'ambiguous', options: [state.cls.serviceId, alts[0]], confidence: 0.4 };
    renderChoose(); go('choose');
  };

  function renderChoose() {
    document.getElementById('choose-opts').innerHTML = state.cls.options.map(function (id) {
      var r = C1.serviceCatalog[id];
      return '<button class="tile" onclick="pick(\'' + id + '\')"><span class="t">' + esc(r.title[lang]) +
        '</span><span class="s">' + esc(r.responsibleEntity) + '</span></button>';
    }).join('');
  }

  function renderEmergency() {
    var g = C1.EMERGENCY_GUIDANCE[lang];
    document.getElementById('em-h').textContent = g.heading;
    document.getElementById('em-b').textContent = g.body;
    document.getElementById('em-911').textContent = g.emergency;
    document.getElementById('em-sh').textContent = g.sheriff;
  }

  function buildAndShow() {
    caseSeed = caseSeed >= 9999 ? 1000 : caseSeed + 1;
    state.receipt = C1.buildReceipt(state.text, state.cls, { lang: lang, caseIdSeed: caseSeed });
    state.confirmation = null; state.resolved = false; state.deleted = false; state.evidenceDone = false;
    state.evidenceTicks = [];
    // AUDIT A-02: the previous case's confirmation number used to stay in the
    // field, where it could be saved onto the wrong case.
    var confEl = document.getElementById('conf');
    if (confEl) confEl.value = '';
    state.createdAt = new Date().toISOString();
    if (state.receipt && state.receipt.kind === 'action') {
      track('route_recommended', {
        service_id: state.receipt.serviceId,
        confidence_band: C1.confidenceBand(state.receipt.confidence),
        jurisdiction: state.receipt.jurisdiction
      });
      var dd = Math.max(0, Math.round((new Date(state.receipt.followUpDate) - new Date()) / 86400000));
      track('follow_up_scheduled', { service_id: state.receipt.serviceId, days_ahead: dd });
    }
    renderReceipt(); renderTimeline(); renderDash(); renderKeepBar(); persist();
    go('receipt');
  }

  function pill(v) {
    if (v === 'officially_verified') return '<span class="pill p-ver">● ' + t('verified') + '</span>';
    if (v === 'needs_confirmation') return '<span class="pill p-need">▲ ' + t('needsconf') + '</span>';
    return '<span class="pill p-hist">○ ' + esc(v) + '</span>';
  }

  function renderReceipt() {
    if (!state.cls || !state.receipt) return;
    // Rebuild in the active language so the receipt is never mixed-language.
    // Classifications that carry no route (emergency, unsupported, ambiguous)
    // legitimately return null here; bail rather than dereference it.
    var rebuilt = C1.buildReceipt(state.text, state.cls, { lang: lang, caseIdSeed: caseSeed });
    if (!rebuilt || rebuilt.kind !== 'action') return;
    state.receipt = rebuilt;
    var r = state.receipt;
    var methods = r.intakeMethods.map(function (m) {
      var dest = m.type === 'web'
        ? '<a href="' + esc(m.destination) + '" target="_blank" rel="noopener">' + esc(m.destination) + '</a>'
        : '<a href="tel:' + esc(m.destination.replace(/[^0-9]/g, '')) + '">' + esc(m.destination) + '</a>';
      var hook = ' onclick="handoff(\'' + esc(m.type) + '\',\'' + esc(m.verificationState) + '\')"';
      dest = dest.replace('<a ', '<a' + hook + ' ');
      return '<div class="method"><div>' + pill(m.verificationState) + '</div>' +
        '<div style="font-weight:600">' + esc(m.label) + '</div>' +
        '<div class="big">' + dest + '</div>' +
        '<div style="font-size:13px;color:var(--ink-60)">' + t('reaches') + ': ' + esc(m.reaches) + '</div>' +
        (m.appliesWhen ? '<div style="font-size:13px;color:var(--ink-60)">' + t('useWhen') + ': ' + esc(m.appliesWhen) + '</div>' : '') +
        '<div style="font-family:var(--mono);font-size:11px;color:var(--ink-60)">LAST VERIFIED ' + esc(m.lastVerifiedAt) + '</div></div>';
    }).join('');

    document.getElementById('receipt').innerHTML =
      '<div class="r-head"><div class="r-meta">' +
        '<span>CASE <b>' + esc(r.caseId) + '</b></span>' +
        '<span>STATUS <b>' + esc(r.status) + '</b></span>' +
        '<span>' + t('conf').toUpperCase() + ' <b>' + Math.round(r.confidence * 100) + '%</b></span>' +
        '<span>' + esc(r.jurisdiction.toUpperCase()) + '</span></div>' +
        '<h2>' + esc(r.title) + '</h2></div>' +
      '<div class="r-body">' +
        '<div class="blk"><h3>' + t('yousaid') + '</h3><p class="kv" style="font-style:italic">“' + esc(r.residentSummary) + '”</p></div>' +
        '<div class="blk"><h3>' + t('owner') + '</h3><p class="kv"><b>' + esc(r.owner) + '</b></p></div>' +
        '<div class="blk"><h3>' + t('action') + '</h3>' + methods +
          '<div class="notice n-demo" style="margin-top:4px"><span class="ic" aria-hidden="true">▲</span><span>' + esc(r.disclosure) + '</span></div></div>' +
        '<div class="blk"><h3>' + t('evidence') + '</h3><ul class="check live" id="evlist">' +
          r.evidence.map(function (e, i) {
            return '<li><label><input type="checkbox" class="evbox" onchange="evidenceTick()" ' +
              'aria-label="' + esc(e) + '"><span>' + esc(e) + '</span></label></li>';
          }).join('') + '</ul><p class="ev-prog" id="ev-prog"></p></div>' +
        '<div class="blk"><h3>' + t('prohibited') + '</h3><ul class="check no">' +
          r.prohibited.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="notice n-warn"><span class="ic" aria-hidden="true">▲</span><div><b>' + t('stopFirst') + '</b><ul style="margin:6px 0 0;padding-left:18px">' +
          r.emergencyExclusions.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div></div>' +
        '<div class="blk"><h3>' + t('script') + '</h3><p class="script">' + esc(r.script) + '</p></div>' +
        '<div class="blk"><h3>' + t('save') + '</h3><p class="kv">' + esc(r.expectedConfirmation || '—') + '</p></div>' +
        '<div class="blk"><h3>' + t('follow') + '</h3><p class="kv"><b>' + esc(r.followUpDate) + '</b> — ' + esc(r.followUpCheckpoint) + '</p>' +
          '<p style="font-size:13px;color:var(--ink-60)">' + t('noSla') + '</p></div>' +
        '<div class="blk"><h3>' + t('sources') + '</h3><div class="srcs">' +
          r.sources.map(function (s) { return '<div>• <a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a> — verified ' + esc(s.lastVerifiedAt) + '</div>'; }).join('') +
          '<div style="margin-top:4px">Maintainer: ' + esc(r.maintainer) + ' · Next review ' + esc(r.nextReviewAt) + '</div></div></div>' +
      '</div>';
    restoreEvidenceTicks();
  }

  function renderTimeline() {
    var el = document.getElementById('tl'); if (!el) return;
    var r = state.receipt;
    // AUDIT A-03: the deleted-state message was unreachable, because the
    // null-receipt guard ran first and blanked the timeline silently. A
    // resident who pressed Delete saw nothing at all.
    if (state.deleted) {
      el.innerHTML = '<li><div class="d"></div><div class="dot"><i></i></div><div><div class="st">' +
        (lang === 'en' ? 'Case deleted' : 'Caso eliminado') + '</div><div class="nt">' +
        (lang === 'en' ? 'All details for this case were removed from this device.' : 'Todos los detalles de este caso se eliminaron de este dispositivo.') +
        '</div></div></li>';
      return;
    }
    if (!r || r.kind !== 'action') { el.innerHTML = ''; return; }
    var day = lang === 'en' ? ['Today', 'Today', 'Today', 'By ' + r.followUpDate, r.followUpDate]
                            : ['Hoy', 'Hoy', 'Hoy', 'Para ' + r.followUpDate, r.followUpDate];
    var rows = [
      ['HEARD', day[0], lang === 'en' ? 'You described the issue in your own words.' : 'Usted describió el problema en sus propias palabras.', true],
      ['CLASSIFIED', day[1], (lang === 'en' ? 'Matched to ' : 'Asociado con ') + r.title + ' (' + Math.round(r.confidence * 100) + '%).', true],
      ['READY', day[2], lang === 'en' ? 'Evidence list and official contact prepared.' : 'Lista de evidencia y contacto oficial preparados.', true],
      ['SUBMITTED', day[3], state.confirmation
        ? (lang === 'en' ? 'Confirmation saved: ' : 'Confirmación guardada: ') + state.confirmation
        : (lang === 'en' ? 'Waiting for you to contact the city and save your confirmation.' : 'Esperando que contacte a la ciudad y guarde su confirmación.'), !!state.confirmation],
      ['FOLLOW-UP DUE', day[4], lang === 'en' ? 'Check back if you have not heard anything.' : 'Verifique si no ha recibido respuesta.', state.resolved],
      ['RESOLVED', state.resolved ? day[4] : '—', state.resolved
        ? (lang === 'en' ? 'You marked this resolved.' : 'Usted marcó esto como resuelto.')
        : (lang === 'en' ? 'Not yet.' : 'Todavía no.'), state.resolved]
    ];
    var rb = document.getElementById('btn-reopen');
    if (rb) rb.classList.toggle('hidden', !state.resolved);
    var firstOpen = rows.findIndex(function (x) { return !x[3]; });
    el.innerHTML = rows.map(function (x, i) {
      var cls = x[3] ? 'done' : (i === firstOpen ? 'now' : '');
      return '<li class="' + cls + '"><div class="d">' + esc(x[1]) + '</div><div class="dot"><i></i></div>' +
        '<div><div class="st">' + esc(x[0]) + '</div><div class="nt">' + esc(x[2]) + '</div></div></li>';
    }).join('');
  }

  function restoreEvidenceTicks() {
    // AUDIT A-05: renderReceipt rebuilds the list, which used to wipe the
    // resident's progress every time they switched language.
    var boxes = [].slice.call(document.querySelectorAll('#evlist .evbox'));
    boxes.forEach(function (b, i) { b.checked = state.evidenceTicks.indexOf(i) !== -1; });
    updateEvidenceProgress(false);
  }

  function updateEvidenceProgress(fireEvent) {
    var boxes = [].slice.call(document.querySelectorAll('#evlist .evbox'));
    var done = boxes.filter(function (b) { return b.checked; }).length;
    var p = document.getElementById('ev-prog');
    if (p) p.textContent = boxes.length ? t('evDone') + ': ' + done + ' / ' + boxes.length : '';
    if (fireEvent && boxes.length && done === boxes.length && !state.evidenceDone) {
      state.evidenceDone = true;
      track('evidence_checklist_completed', { service_id: sid(), item_count: boxes.length });
    }
  }

  window.evidenceTick = function () {
    var boxes = [].slice.call(document.querySelectorAll('#evlist .evbox'));
    state.evidenceTicks = boxes.map(function (b, i) { return b.checked ? i : -1; })
                               .filter(function (i) { return i !== -1; });
    var done = boxes.filter(function (b) { return b.checked; }).length;
    updateEvidenceProgress(true);
    persist();
  };

  window.handoff = function (methodType, verificationState) {
    track('official_handoff_opened', { service_id: sid(), method_type: methodType, verification_state: verificationState });
  };

  window.saveConf = function () {
    var v = document.getElementById('conf').value.trim();
    if (!v) {
      track('error_shown', { error_code: 'empty_confirmation', view: 'timeline' });
      document.getElementById('conf').focus();
      return;
    }
    state.confirmation = C1.sanitizeResidentText(v, 60);
    track('confirmation_saved', { service_id: sid() });
    renderTimeline(); renderDash(); persist();
  };
  window.markResolved = function () {
    state.resolved = true;
    track('case_marked_resolved', { service_id: sid() });
    renderTimeline(); renderDash(); persist();
  };
  window.reopenCase = function () {
    state.resolved = false;
    track('case_reopened', { service_id: sid() });
    renderTimeline(); renderDash(); persist();
  };
  window.deleteCase = function () {
    var id = sid();
    var removedId = state.receipt && state.receipt.caseId;
    state.deleted = true; state.receipt = null; state.cls = null; state.text = '';
    state.confirmation = null; state.resolved = false; state.evidenceTicks = []; state.evidenceDone = false;
    // AUDIT A-04: deletion used to leave the resident's own words rendered on
    // the receipt view. Deletion has to remove the surface, not just the state.
    var r = document.getElementById('receipt'); if (r) r.innerHTML = '';
    var c = document.getElementById('conf'); if (c) c.value = '';
    var i = document.getElementById('issue'); if (i) i.value = '';
    if (removedId) store.remove(removedId);
    track('case_deleted', { service_id: id });
    renderTimeline(); renderDash(); renderKeepBar();
  };

  var DEMO = [
    { id: 'C1-1001', sid: 'missed_trash', st: 'FOLLOW-UP DUE', age: 2 },
    { id: 'C1-1002', sid: 'streetlight', st: 'SUBMITTED', age: 1 },
    { id: 'C1-1003', sid: 'illegal_dumping', st: 'RESOLVED', age: 5 },
    { id: 'C1-1004', sid: 'pothole', st: 'READY', age: 0 }
  ];
  function badge(s) {
    var m = { 'RESOLVED': 'b-res', 'FOLLOW-UP DUE': 'b-due', 'SUBMITTED': 'b-sub', 'READY': 'b-ready' };
    return '<span class="badge ' + (m[s] || '') + '">' + esc(s) + '</span>';
  }
  function renderDash() {
    var savedEl = document.getElementById('saved');
    if (savedEl) {
      var saved = store.list();
      savedEl.innerHTML = saved.length
        ? saved.map(function (c) {
            var title = C1.serviceCatalog[c.serviceId] ? C1.serviceCatalog[c.serviceId].title[lang] : c.serviceId;
            return '<div class="caseitem"><span class="id">' + esc(c.caseId) + '</span><span class="ti">' +
              esc(title) + '</span>' + badge(c.status) +
              '<button class="btn btn-quiet" style="padding:9px 14px;min-height:44px" onclick="openSaved(\'' +
              esc(c.caseId) + '\')">' + esc(t('openCase')) + '</button></div>';
          }).join('')
        : '<p class="hint">' + esc(t('noSaved')) + '</p>';
    }
    var list = DEMO.slice();
    if (state.receipt && state.receipt.kind === 'action' && !state.deleted) {
      list.unshift({ id: state.receipt.caseId, sid: state.receipt.serviceId, age: 0, mine: true,
        st: state.resolved ? 'RESOLVED' : state.confirmation ? 'SUBMITTED' : 'READY' });
    }
    var resolved = list.filter(function (c) { return c.st === 'RESOLVED'; }).length;
    var due = list.filter(function (c) { return c.st === 'FOLLOW-UP DUE'; }).length;
    var stats = [[String(list.length), lang === 'en' ? 'Cases' : 'Casos'],
                 [String(resolved), lang === 'en' ? 'Verified resolved' : 'Resueltos verificados'],
                 [String(due), lang === 'en' ? 'Follow-up due' : 'Seguimiento pendiente'],
                 [Math.round(100 * resolved / Math.max(1, list.length)) + '%', lang === 'en' ? 'Outcome rate' : 'Tasa de resultado']];
    var se = document.getElementById('stats');
    if (se) se.innerHTML = stats.map(function (s) { return '<div class="stat"><div class="v">' + esc(s[0]) + '</div><div class="l">' + esc(s[1]) + '</div></div>'; }).join('');
    var ce = document.getElementById('cases');
    if (ce) ce.innerHTML = list.map(function (c) {
      return '<div class="caseitem"><span class="id">' + esc(c.id) + '</span><span class="ti">' +
        esc(C1.serviceCatalog[c.sid].title[lang]) + (c.mine ? ' ★' : '') + '</span>' + badge(c.st) + '</div>';
    }).join('');
  }

  function statusOf() {
    return state.deleted ? null : state.resolved ? 'RESOLVED' : state.confirmation ? 'SUBMITTED' : 'READY';
  }

  function persist() {
    if (!store.isEnabled() || !state.receipt || state.receipt.kind !== 'action' || state.deleted) return;
    var r = state.receipt, now = new Date().toISOString();
    store.save({
      caseId: r.caseId, serviceId: r.serviceId, lang: lang, text: state.text,
      status: statusOf(), confirmation: state.confirmation, followUpDate: r.followUpDate,
      createdAt: state.createdAt || now, updatedAt: now,
      evidenceTicks: state.evidenceTicks.slice(), confidence: r.confidence
    });
    renderKeepBar(); renderDash();
  }

  window.keepAnswer = function (yes) {
    if (yes) {
      var okSave = store.enable();
      if (!okSave) { renderKeepBar(); return; }
      state.createdAt = state.createdAt || new Date().toISOString();
      persist();
    }
    state.keepAsked = true;
    renderKeepBar();
  };

  window.eraseAll = function () {
    store.wipe();
    state.keepAsked = true;
    renderKeepBar(); renderDash();
    var n = document.getElementById('erased-note');
    if (n) n.textContent = t('erased');
  };

  function renderKeepBar() {
    var bar = document.getElementById('keepbar');
    if (!bar) return;
    bar.removeAttribute('style');
    if (store.isEnabled()) {
      bar.className = 'notice n-privacy';
      bar.innerHTML = '<span class="ic" aria-hidden="true">🔒</span><span>' + esc(t('keepOn')) +
        ' · <button class="linkbtn" onclick="eraseAll()">' + esc(t('erase')) + '</button></span>';
      return;
    }
    if (store.degraded) {
      bar.className = 'notice n-warn';
      bar.innerHTML = '<span class="ic" aria-hidden="true">▲</span><span>' + esc(t('keepFail')) + '</span>';
      return;
    }
    if (state.keepAsked) {
      // AUDIT P-01: declining used to be permanent — there was no way back.
      // The card does not nag again, but the door stays open.
      bar.className = 'notice n-demo';
      bar.innerHTML = '<span class="ic" aria-hidden="true">○</span><span>' + esc(t('keepOff')) +
        ' · <button class="linkbtn" onclick="keepAnswer(true)">' + esc(t('keepYes')) + '</button>' +
        '</span><p class="hint" id="erased-note" style="margin:0"></p>';
      return;
    }
    bar.className = 'card';
    bar.setAttribute('style', 'background:var(--paper);border-style:dashed');
    bar.innerHTML = '<h3 style="font-size:22px;margin-bottom:8px">' + esc(t('keepH')) + '</h3>' +
      '<p class="hint" style="margin-bottom:14px">' + esc(t('keepBody')) + '</p>' +
      '<div class="row"><button class="btn btn-dark" onclick="keepAnswer(true)">' + esc(t('keepYes')) + '</button>' +
      '<button class="btn btn-quiet" onclick="keepAnswer(false)">' + esc(t('keepNo')) + '</button></div>' +
      '<p class="hint" id="erased-note" style="margin-top:10px"></p>';
  }

  window.openSaved = function (caseId) {
    var c = store.get(caseId);
    if (!c) return;
    lang = c.lang; applyLang();
    // AUDIT P-02: stripping all non-digits also ate the '1' in the 'C1-'
    // prefix, so reopening C1-1044 rebuilt it as C1-11044 — and the later
    // delete then missed the stored record entirely. Match the suffix only.
    var m = /(\d+)$/.exec(String(c.caseId));
    caseSeed = m ? parseInt(m[1], 10) : caseSeed;
    state.text = c.text;
    state.cls = { kind: 'routed', serviceId: c.serviceId, confidence: c.confidence || 0.9, alternates: [] };
    state.receipt = C1.buildReceipt(c.text, state.cls, { lang: lang, caseIdSeed: caseSeed });
    state.confirmation = c.confirmation; state.resolved = c.status === 'RESOLVED';
    state.deleted = false; state.evidenceTicks = (c.evidenceTicks || []).slice();
    state.evidenceDone = false; state.createdAt = c.createdAt; state.keepAsked = true;
    var confEl = document.getElementById('conf'); if (confEl) confEl.value = c.confirmation || '';
    renderReceipt(); renderTimeline(); renderDash(); renderKeepBar();
    go('receipt');
  };

  window.downloadIcs = function () {
    var r = state.receipt;
    if (!r || r.kind !== 'action') return;
    var m = r.intakeMethods && r.intakeMethods[0];
    var ics = C1.buildReminderIcs({
      caseId: r.caseId, title: r.title, owner: r.owner, followUpDate: r.followUpDate,
      contact: m ? m.destination : '(310) 605-5500', confirmation: state.confirmation, lang: lang
    });
    // Blob rather than a data: URI — data URIs are blocked or decoded oddly in
    // sandboxed frames and in-app browsers, which is where residents actually are.
    var name = C1.reminderFilename(r.caseId);
    try {
      var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    } catch (e) {
      // Last resort: show the reminder as text the resident can copy.
      openFallbackWindow('<pre style="white-space:pre-wrap;font:13px ui-monospace,monospace">' +
        esc(ics) + '</pre>', name);
    }
    track('follow_up_scheduled', { service_id: r.serviceId, days_ahead: 0 });
  };

  // Opens content in a new window; if popups are blocked, renders it inline.
  function openFallbackWindow(html, title) {
    var doc = '<!doctype html><html lang="' + lang + '"><head><meta charset="utf-8">' +
      '<title>' + esc(title) + '</title><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>body{font:15px/1.5 system-ui,sans-serif;margin:24px;color:#101210;background:#fff}' +
      'h1,h2,h3{font-family:system-ui,sans-serif} .r-head{margin-bottom:14px} .blk{margin:14px 0}' +
      '.method{border:1px solid #999;border-radius:8px;padding:10px;margin:8px 0}' +
      'ul{padding-left:18px} a{color:#000}</style></head><body>' + html +
      '<script>setTimeout(function(){try{window.print()}catch(e){}},350)<\/script></body></html>';
    var w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w && w.document) { w.document.open(); w.document.write(doc); w.document.close(); return true; }
    return false;
  }

  // ---- BUG: window.print() is blocked in sandboxed frames and some in-app
  // browsers, so the button silently did nothing. Try it, then fall back to a
  // printable window, then to an inline printable view.
  window.printReceipt = function () {
    var r = state.receipt;
    var printable = document.getElementById('receipt');
    var ok = false;
    try { window.print(); ok = true; } catch (e) { ok = false; }
    if (ok) return;
    if (printable && openFallbackWindow(printable.innerHTML, 'Compton One — ' + (r ? r.caseId : 'receipt'))) return;
    document.body.classList.add('print-only');
    window.scrollTo({ top: 0 });
    var note = document.getElementById('print-note');
    if (note) note.textContent = t('printFallback');
  };

  function renderPrivacy() {
    var f = document.getElementById('funnel');
    var l = document.getElementById('evlog');
    if (!f || !l) return;
    var rows = A.funnel();
    var max = Math.max(1, rows[0].count, 1);
    f.innerHTML = rows.map(function (r) {
      var w = Math.round(8 + 120 * (r.count / max));
      return '<div class="r"><span class="lab">' + esc(r.stage) + '</span>' +
        '<span class="bar" style="width:' + (r.count ? w : 3) + 'px;opacity:' + (r.count ? 1 : .18) + '"></span>' +
        '<span class="n">' + r.count + '</span></div>';
    }).join('');
    var evs = A.drain();
    l.innerHTML = evs.length
      ? evs.slice().reverse().map(function (e) {
          var props = Object.keys(e.props).map(function (k) { return k + '=' + e.props[k]; }).join(' · ');
          return '<div class="row2"><span class="p">' + String(e.seq).padStart(2, '0') + '</span>' +
            '<span class="e">' + esc(e.event) + '</span><span class="p">' + esc(props) + '</span></div>';
        }).join('')
      : '<div class="row2"><span class="p">' + esc(t('evNone')) + '</span></div>';
  }

  var _go = go;
  go = window.go = function (v) { _go(v); if (v === 'dashboard') renderPrivacy(); };

  applyLang();
  renderPrivacy();
  renderKeepBar();
  renderDash();
  go('landing');
})();
</script>
</body>
</html>
